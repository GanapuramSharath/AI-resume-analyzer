version: "3.9"

services:

  app:
    build: .

    container_name: resume-app

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - redis

  worker:
    build: .

    container_name: resume-worker

    command: npm run worker

    env_file:
      - .env

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  redis-data: